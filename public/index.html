const ik = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
const KEY = "abdulgpt_v2";

function gorunum(){
  const acik = gor.tema === "acik" || (gor.tema === "oto" && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.tema = acik ? "acik" : "koyu";

const liste = $("liste"), t = $("t"), b = $("b"), modSec = $("mod");

document.title = AD; $("ad").textContent = AD;
if (/\.(png|jpe?g|svg|webp)$/i.test(LOGO)) { const i = document.createElement("img"); i.src = LOGO; i.alt = ""; $("logo").appendChild(i); }
else if (LOGO === "mark") $("logo").innerHTML = MARK; else $("logo").textContent = LOGO;

try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!db || !Array.isArray(db.sohbetler) || !db.sohbetler.length) { db = { aktif: null, sohbetler: [] }; yeniSohbet(false); }
const cur = () => db.sohbetler.find(s => s.id === db.aktif) || db.sohbetler[0];
function kaydet(){ try { localStorage.setItem(KEY, JSON.stringify(db, (k, v) => k === "img" ? undefined : v)); } catch {}
  if (window.Hesap) window.Hesap.kaydet(db);
}
function yeniSohbet(ciz = true){
  const s = { id: Date.now().toString(36), baslik: "Yeni sohbet", mod: "genel", m: [], t: Date.now() };
  db.sohbetler.unshift(s); db.aktif = s.id;
  if (db.sohbetler.length > 30) db.sohbetler.pop();
  kaydet(); if (ciz) cizHepsi();
}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  return s.split("```").map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"), kod = nl >= 0 ? p.slice(nl + 1) : "";
      return '<div class="kod"><button type="button" class="kopya">Kopyala</button><pre><code>' + esc(kod.replace(/\n$/, "")) + '</code></pre></div>'; }
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}
const kaydir = () => { liste.scrollTop = liste.scrollHeight; };
function ekle(metin, sinif, img, foto){
  const d = document.createElement("div"); d.className = "m " + sinif;
  if (sinif === "a") { d.innerHTML = md(temizle(metin)); mat(d); }
  else {
    if (img) { const i = document.createElement("img"); i.src = img; i.className = "foto"; i.alt = "Gönderilen resim"; d.appendChild(i); }
    else if (foto) { const p = document.createElement("div"); p.textContent = "(resim)"; d.appendChild(p); }
    if (metin) d.appendChild(document.createTextNode(metin));
  }
  liste.appendChild(d); kaydir(); return d;
}
const HIZLI = {
  genel: ["Bana ilginç bir bilgi ver", "Bugün için bir plan yap", "Kısa bir hikaye yaz", "Şunu basitçe açıkla:"],
  kodlama: ["Basit bir HTML sayfası yaz", "Bu kodu açıkla:", "Şu hatayı çöz:"],

  ozetleyici: ["Şu metni özetle:", "Ana fikirleri çıkar:"],

};
function hizliCiz(mod){
  const h = document.createElement("div"); h.className = "hizli";
  h.innerHTML = (HIZLI[mod] || HIZLI.genel).map(x => `<button type="button" class="hz" data-q="${esc(x)}">${esc(x)}</button>`).join("");

}
const KARTLAR = [
  { i: "book",  b: "Ödev yardımcısı", a: "Adım adım çözsün",     mod: "ders",       q: "Şu soruyu çöz:" },
  { i: "image", b: "Resimden sor",    a: "Fotoğraf yükle",       foto: true },
  { i: "code",  b: "Kod yaz",         a: "Kod üret, hata bul",   mod: "kodlama",    q: "Şunu kodla:" },
  { i: "lang",  b: "Çeviri",          a: "Türkçe ↔ İngilizce",   mod: "cevirmen",   q: "Çevir:" },
  { i: "file",  b: "Özetle",          a: "Uzun metni kısalt",    mod: "ozetleyici", q: "Şu metni özetle:" },
  { i: "bulb",  b: "Fikir ver",       a: "İlginç bir şey öğren", mod: "genel",      q: "Bana ilginç bir bilgi ver" }
];
function selam(){ const h = new Date().getHours(); return h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar"; }
function karsilaCiz(){
  const ad = (window.UYG && window.UYG.ad) ? " " + window.UYG.ad.split(" ")[0] : "";
  const resim = /\.(png|jpe?g|svg|webp)$/i.test(LOGO);
  const d = document.createElement("div"); d.className = "karsi";
  d.innerHTML = '<div class="logo">' + (resim ? '<img src="' + esc(LOGO) + '" alt="" style="width:100%;height:100%;object-fit:cover">' : (LOGO === "mark" ? MARK : esc(LOGO))) + '</div>' +
    '<h2>' + selam() + '<b>' + esc(ad) + '</b>,<br>bugün ne yapalım?</h2><p>' + esc(AD) + ' ile soru sor, resim yükle ya da sesle konuş.</p><div class="kartlar">' +
    KARTLAR.map((k, n) => '<button type="button" class="kart" data-k="' + n + '"><i>' + ik(k.i) + '</i><b>' + k.b + '</b><span>' + k.a + '</span></button>').join("") + '</div>';
  liste.appendChild(d);
}
function eylemSil(){ liste.querySelectorAll(".eylem").forEach(e => e.remove()); }
function eylemEkle(){
  eylemSil();
  const s = cur(), son = s.m[s.m.length - 1], bub = liste.lastElementChild;
  if (!son || son.role !== "assistant" || !bub || !bub.classList.contains("a") || bub.classList.contains("hata")) return;
  const d = document.createElement("div"); d.className = "eylem";
  d.innerHTML = '<button type="button" data-e="kopya">Kopyala</button><button type="button" data-e="yeniden">Yeniden üret</button>';
  bub.appendChild(d);
}
function cizYan(){
  $("liste2").innerHTML = db.sohbetler.map(s =>
    `<div class="it ${s.id === db.aktif ? "on" : ""}" data-id="${s.id}"><span>${esc(s.baslik)}</span><button type="button" class="sil" data-sil="${s.id}" aria-label="Sohbeti sil">✕</button></div>`).join("");
}
function cizHepsi(){
  const s = cur(); $("baslik").textContent = s.baslik; modSec.value = s.mod;
  liste.innerHTML = "";
  if (!s.m.length) karsilaCiz();
  s.m.forEach(m => ekle(m.content, m.role === "user" ? "k" : "a", null, m.foto));
  eylemEkle(); cizYan(); $("yan").classList.remove("ac");
}
cizHepsi();

$("liste2").addEventListener("click", e => {
  const sil = e.target.dataset.sil;
  if (sil) {
    if (yaziyor) ac.abort();
    if (window.Hesap) window.Hesap.sil(sil);
    db.sohbetler = db.sohbetler.filter(s => s.id !== sil);
    if (!db.sohbetler.length) yeniSohbet(false);
    if (db.aktif === sil) db.aktif = db.sohbetler[0].id;
    kaydet(); cizHepsi(); return;
  }
  const it = e.target.closest(".it");
  if (it && !yaziyor) { db.aktif = it.dataset.id; kaydet(); cizHepsi(); }
});
$("yeni").addEventListener("click", () => { if (yaziyor) ac.abort(); yeniSohbet(); });
$("menu").addEventListener("click", () => $("yan").classList.toggle("ac"));
modSec.addEventListener("change", () => { cur().mod = modSec.value; kaydet(); if (!cur().m.length) cizHepsi(); });
liste.addEventListener("click", e => {
  if (!e.target.classList.contains("kopya")) return;
  navigator.clipboard.writeText(e.target.parentElement.querySelector("code").textContent)
    .then(() => { e.target.textContent = "Kopyalandı"; setTimeout(() => e.target.textContent = "Kopyala", 1500); });
});

// Resim ekleme (küçültüp JPEG yapar)
$("ek").addEventListener("click", () => $("dosya").click());
$("dosya").addEventListener("change", () => {
  const f = $("dosya").files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    bekleyen = c.toDataURL("image/jpeg", 0.8); $("onimg").src = bekleyen; $("onizle").hidden = false;
  }; im.src = rd.result; };
  rd.readAsDataURL(f);
});
$("onkaldir").addEventListener("click", () => { bekleyen = null; $("onizle").hidden = true; $("dosya").value = ""; });

// Mikrofon (konuşmayı yazıya çevirir)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) $("mik").hidden = true;
else {
  rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = true;
  rec.onresult = e => { t.value = Array.from(e.results).map(r => r[0].transcript).join(""); t.dispatchEvent(new Event("input")); };
  rec.onend = () => $("mik").classList.remove("on");
  rec.onerror = () => $("mik").classList.remove("on");
  $("mik").addEventListener("click", () => {
    if ($("mik").classList.contains("on")) { rec.stop(); return; }
    try { rec.start(); $("mik").classList.add("on"); } catch {}
  });
}
// Cevapları sesli okuma
if (!window.speechSynthesis) $("ses").hidden = true;
$("ses").addEventListener("click", () => {
  sesli = !sesli; $("ses").classList.toggle("on", sesli);
  if (!sesli) speechSynthesis.cancel();
});
function oku(metin){
  const u = new SpeechSynthesisUtterance(metin.replace(/```[\s\S]*?```/g, " kod bloğu ").replace(/[*`#]/g, ""));
  u.lang = "tr-TR"; speechSynthesis.speak(u);
}

function temizle(s){ return s.replace(/\[HATIRLA:[^\]]*\]/g, "").replace(/\[HATIRLA:[^\]]*$/, "").replace(/\s+$/, ""); }
function mat(el){
  if (window.renderMathInElement && cur().mod === "ders")
    try { renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false }); } catch {}
}
const profilGet = () => { try { return localStorage.getItem("abdulgpt_profil") || ""; } catch { return ""; } };
const profilSet = v => { try { localStorage.setItem("abdulgpt_profil", v); } catch {} };
function bildir(m){ const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function profilEkle(bilgiler){
  const satir = profilGet().split("\n").map(x => x.trim()).filter(Boolean), yeni = [];
  bilgiler.forEach(x => { x = x.slice(0, 120); if (!satir.some(y => y.toLowerCase() === x.toLowerCase())) { satir.push(x); yeni.push(x); } });
  if (!yeni.length) return;
  profilSet(satir.slice(-25).join("\n")); bildir("Hatırladım: " + yeni.join(", "));
}
$("ayarb").addEventListener("click", () => { $("profil").value = profilGet(); $("tema").value = gor.tema; $("boyut").value = gor.boyut; $("ayar").showModal(); });
$("ayarkapat").addEventListener("click", () => { profilSet($("profil").value.trim()); $("ayar").close(); });
addEventListener("load", () => { if (cur().mod === "ders") cizHepsi(); });
function arayuz(acik){ yaziyor = acik; b.innerHTML = ik(acik ? "stop" : "send"); b.setAttribute("aria-label", acik ? "Durdur" : "Gönder"); b.classList.toggle("dur", acik); }

async function gonder(yeniden = false){
  const s = cur();
  if (!yeniden) {
    const metin = t.value.trim();
    if (!metin && !bekleyen) return;
    if (!s.m.length) liste.innerHTML = "";
    const img = bekleyen; bekleyen = null; $("onizle").hidden = true; $("dosya").value = "";
    t.value = ""; t.style.height = "auto";
    s.m.push({ role: "user", content: metin, img: img || undefined, foto: img ? true : undefined });
    if (s.baslik === "Yeni sohbet") { s.baslik = (metin || "Resim").slice(0, 32); $("baslik").textContent = s.baslik; }
    ekle(metin, "k", img); cizYan();
  }
  eylemSil();
  if (window.speechSynthesis) speechSynthesis.cancel();
  const bub = ekle("…", "a");
  ac = new AbortController(); arayuz(true);
  let cevap = "";
  try {
    const govde = s.m.map((x, i) => ({
      role: x.role,
      content: x.content || (x.img ? "Bu resmi anlat." : x.foto ? "(resim gönderildi)" : ""),
      image: i === s.m.length - 1 ? x.img : undefined
    }));
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "x-sifre": encodeURIComponent(sifre) }, signal: ac.signal,
      body: JSON.stringify({ messages: govde, mod: s.mod, profil: profilGet().slice(0, 1200) }) });
    if (r.status === 401) { sifre = ""; try { localStorage.removeItem("abdulgpt_sifre"); } catch {} girisAc("Şifre gerekli."); }
    if (!r.ok) { const v = await r.json().catch(() => ({})); throw new Error(v.hata || "Bir hata oluştu"); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const blok = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!blok.startsWith("data: ")) continue;
        const o = JSON.parse(blok.slice(6));
        if (o.hata) throw new Error(o.hata);
        if (o.t) { cevap += o.t; bub.innerHTML = md(temizle(cevap)); kaydir(); }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") { bub.classList.add("hata"); bub.textContent = e.message; if (!cevap && !yeniden) s.m.pop(); }
  }
  if (cevap) {
    const bul = [...cevap.matchAll(/\[HATIRLA:\s*([^\]]+)\]/g)].map(m => m[1].trim());
    cevap = temizle(cevap); bub.innerHTML = md(cevap); mat(bub);
    if (bul.length) profilEkle(bul);
    s.m.push({ role: "assistant", content: cevap });
    if (sesli && window.speechSynthesis) oku(cevap);
  }
  else if (bub.textContent === "…") bub.remove();
  s.t = Date.now(); kaydet(); eylemEkle(); arayuz(false); t.focus();
}
$("f").addEventListener("submit", e => { e.preventDefault(); if (yaziyor) ac.abort(); else gonder(); });
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!yaziyor) gonder(); } });
t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; });

liste.addEventListener("click", e => {
  const kt = e.target.closest(".kart");
  if (kt) {
    if (yaziyor) return;
    const k = KARTLAR[+kt.dataset.k];
    if (k.foto) { $("dosya").click(); return; }
    cur().mod = k.mod; modSec.value = k.mod; kaydet();
    t.value = k.q.endsWith(":") ? k.q + " " : k.q;
    if (k.q.endsWith(":")) t.focus(); else gonder();
    return;
  }
  const hz = e.target.closest(".hz");
  if (hz) {
    if (yaziyor) return;
    const x = hz.dataset.q;
    if (x.endsWith(":")) { t.value = x + " "; t.focus(); } else { t.value = x; gonder(); }
    return;
  }
  const eb = e.target.closest("[data-e]");
  if (!eb || yaziyor) return;
  const s = cur(), son = s.m[s.m.length - 1];
  if (!son || son.role !== "assistant") return;
  if (eb.dataset.e === "kopya") {
    navigator.clipboard.writeText(son.content).then(() => { eb.textContent = "Kopyalandı"; setTimeout(() => eb.textContent = "Kopyala", 1500); });
  } else { s.m.pop(); liste.lastElementChild.remove(); gonder(true); }
});
function gorKaydet(){ try { localStorage.setItem("abdulgpt_gorunum", JSON.stringify(gor)); } catch {} gorunum(); }
$("tema").addEventListener("change", () => { gor.tema = $("tema").value; gorKaydet(); });
$("boyut").addEventListener("change", () => { gor.boyut = $("boyut").value; gorKaydet(); });

// Şifre koruması (sunucuda SIFRE tanımlıysa devreye girer)
let sifre = ""; try { sifre = localStorage.getItem("abdulgpt_sifre") || ""; } catch {}
async function sifreDene(x){
  try { const r = await fetch("/api/giris", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sifre: x }) }); return r.ok; }
  catch { return false; }
}
function girisAc(mesaj = ""){ $("girishata").textContent = mesaj; if (!$("giris").open) $("giris").showModal(); $("sifre").focus(); }
async function girisKontrol(){
  try {
    const d = await (await fetch("/api/durum")).json();
    if (!d.sifreli) return;
    if (sifre && await sifreDene(sifre)) return;
    girisAc();
  } catch {}
}
$("giris").addEventListener("cancel", e => e.preventDefault());
$("girisb").addEventListener("click", async () => {
  const x = $("sifre").value;
  if (await sifreDene(x)) { sifre = x; try { localStorage.setItem("abdulgpt_sifre", x); } catch {} $("sifre").value = ""; $("giris").close(); }
  else $("girishata").textContent = "Şifre yanlış.";
});
$("sifre").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("girisb").click(); } });
$("gece").addEventListener("click", () => { gor.tema = document.documentElement.dataset.tema === "acik" ? "koyu" : "acik"; gorKaydet(); });
// Hesap eklentisi (hesap.js) bu nesne üzerinden sohbetleri okur/yazar
window.UYG = {
  ad: "",
  al: () => db,
  ciz: () => cizHepsi(),
  birlestir(bulut){
    bulut = bulut.filter(c => c && c.id && Array.isArray(c.m));
    const bulutta = new Set(bulut.map(c => c.id));
    const yerel = db.sohbetler.filter(c => !bulutta.has(c.id) && c.m.length);
    db.sohbetler = [...bulut, ...yerel].sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 30);
    if (!db.sohbetler.length) yeniSohbet(false);
    if (!db.sohbetler.some(c => c.id === db.aktif)) db.aktif = db.sohbetler[0].id;
    kaydet(); cizHepsi();
  },
  sifirla(){ db = { aktif: null, sohbetler: [] }; yeniSohbet(false); cizHepsi(); }
};
// Ikonlar
$("menu").innerHTML = ik("menu");
$("ayarb").innerHTML = ik("settings");
$("ek").innerHTML = ik("clip");
$("mik").innerHTML = ik("mic");
$("ses").innerHTML = ik("vol") + "<span>Sesli oku</span>";
$("yeni").innerHTML = ik("plus") + "<span>Yeni sohbet</span>";
arayuz(false); gorunum();
girisKontrol();
</script>
