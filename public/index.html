<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay Zeka Asistanım</title>
<style>
:root{--bg:#0f1720;--panel:#17222e;--kullanici:#2f6fed;--asistan:#223142;--yazi:#e9eef5;--soluk:#8da2b8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--yazi);display:flex;flex-direction:column;height:100dvh;max-width:820px;margin:0 auto}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #243346}
header h1{font-size:1.05rem;flex:1}
select,.k2{font:inherit;font-size:.9rem;color:var(--yazi);background:var(--panel);border:1px solid #2d405a;border-radius:10px;padding:7px 10px;cursor:pointer}
#liste{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.k{align-self:flex-end;background:var(--kullanici);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--asistan);border-bottom-left-radius:4px}
.a.hata{background:#4a2326}
.m code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:#0b121a;padding:1px 5px;border-radius:5px}
.kod{position:relative;margin:8px 0;white-space:normal}
.kod pre{background:#0b121a;border-radius:10px;padding:14px 12px 12px;overflow-x:auto;white-space:pre}
.kod pre code{background:none;padding:0}
.kopya{position:absolute;top:6px;right:6px;font:inherit;font-size:.72rem;color:var(--soluk);background:#17222e;border:1px solid #2d405a;border-radius:6px;padding:2px 8px;cursor:pointer}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #243346;background:var(--panel)}
textarea{flex:1;resize:none;font:inherit;color:var(--yazi);background:var(--bg);border:1px solid #2d405a;border-radius:12px;padding:10px 12px;max-height:140px}
textarea:focus,select:focus-visible,.k2:focus-visible{outline:2px solid var(--kullanici)}
#b{font:inherit;font-weight:700;color:#fff;background:var(--kullanici);border:0;border-radius:12px;padding:0 18px;cursor:pointer}
#b.dur{background:#b8434a}
</style>
</head>
<body>
<header>
  <h1>Yapay Zeka Asistanım</h1>
  <select id="mod" aria-label="Mod">
    <option value="genel">Genel</option>
    <option value="kodlama">Kodlama</option>
    <option value="cevirmen">Çevirmen</option>
    <option value="ozetleyici">Özetleyici</option>
  </select>
  <button class="k2" id="yeni" type="button">Yeni sohbet</button>
</header>
<div id="liste" aria-live="polite"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Mesajını yaz... (Shift+Enter: yeni satır)"></textarea>
  <button id="b">Gönder</button>
</form>
<script>
const $ = id => document.getElementById(id);
const liste = $("liste"), f = $("f"), t = $("t"), b = $("b"), modSec = $("mod");
let gecmis = [], ac = null, yaziyor = false;

try { gecmis = JSON.parse(localStorage.getItem("sohbet") || "[]"); modSec.value = localStorage.getItem("mod") || "genel"; } catch {}
const kaydet = () => { try { localStorage.setItem("sohbet", JSON.stringify(gecmis)); localStorage.setItem("mod", modSec.value); } catch {} };

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  return s.split("```").map((p,i) => {
    if (i % 2) {
      const nl = p.indexOf("\n"), kod = nl >= 0 ? p.slice(nl + 1) : "";
      return '<div class="kod"><button type="button" class="kopya">Kopyala</button><pre><code>' + esc(kod.replace(/\n$/,"")) + '</code></pre></div>';
    }
    return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  }).join("");
}
function ekle(metin, sinif){
  const d = document.createElement("div");
  d.className = "m " + sinif;
  if (sinif === "a") d.innerHTML = md(metin); else d.textContent = metin;
  liste.appendChild(d); kaydir(); return d;
}
const kaydir = () => { liste.scrollTop = liste.scrollHeight; };
function baslat(){
  liste.innerHTML = "";
  if (!gecmis.length) ekle("Merhaba! Ben yapay zeka asistanınım. Yukarıdan mod seçebilirsin. Ne konuşmak istersin?", "a");
  gecmis.forEach(m => ekle(m.content, m.role === "user" ? "k" : "a"));
}
baslat();

liste.addEventListener("click", e => {
  if (!e.target.classList.contains("kopya")) return;
  const kod = e.target.parentElement.querySelector("code").textContent;
  navigator.clipboard.writeText(kod).then(() => { e.target.textContent = "Kopyalandı"; setTimeout(() => e.target.textContent = "Kopyala", 1500); });
});

function arayuz(acik){ yaziyor = acik; b.textContent = acik ? "Durdur" : "Gönder"; b.classList.toggle("dur", acik); }

async function gonder(){
  const metin = t.value.trim(); if (!metin) return;
  if (!gecmis.length) liste.innerHTML = "";
  t.value = ""; t.style.height = "auto";
  gecmis.push({ role: "user", content: metin }); ekle(metin, "k");
  const bub = ekle("…", "a");
  ac = new AbortController(); arayuz(true);
  let cevap = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: ac.signal,
      body: JSON.stringify({ messages: gecmis, mod: modSec.value })
    });
    if (!r.ok) { const v = await r.json().catch(() => ({})); throw new Error(v.hata || "Bir hata oluştu"); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const blok = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!blok.startsWith("data: ")) continue;
        const o = JSON.parse(blok.slice(6));
        if (o.hata) throw new Error(o.hata);
        if (o.t) { cevap += o.t; bub.innerHTML = md(cevap); kaydir(); }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      bub.classList.add("hata"); bub.textContent = e.message;
      if (!cevap) gecmis.pop();
    }
  }
  if (cevap) gecmis.push({ role: "assistant", content: cevap });
  else if (bub.textContent === "…") bub.remove();
  kaydet(); arayuz(false); t.focus();
}

f.addEventListener("submit", e => { e.preventDefault(); if (yaziyor) ac.abort(); else gonder(); });
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!yaziyor) gonder(); } });
t.addEventListener("input", () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; });
modSec.addEventListener("change", kaydet);
$("yeni").addEventListener("click", () => { if (yaziyor) ac.abort(); gecmis = []; kaydet(); baslat(); });
</script>
</body>
</html>
