<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AbdulGPT</title>
<style>
:root{--bg:#0b1220;--panel:#111b2e;--cizgi:#22304a;--yazi:#e8eefb;--soluk:#8a9bb8;--a1:#6366f1;--a2:#06b6d4;--asistan:#18253b;--kod:#0a101c;--hover:#1b2a44;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--yazi);display:flex;height:100dvh;overflow:hidden}
#yan{width:268px;background:var(--panel);border-right:1px solid var(--cizgi);display:flex;flex-direction:column;padding:14px;gap:12px;flex-shrink:0}
.marka{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.marka .lg{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-size:1.25rem;overflow:hidden}
.marka .lg img{width:100%;height:100%;object-fit:cover}
.yenib{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));border:0;border-radius:12px;padding:10px;cursor:pointer}
#liste2{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--soluk);font-size:.92rem}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover,.it.on{background:var(--hover);color:var(--yazi)}
.sil{font:inherit;background:none;border:0;color:var(--soluk);cursor:pointer;opacity:.6}
.sil:hover{opacity:1;color:#ff7b86}
#ana{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--cizgi)}
header h1{font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
select,.ib{font:inherit;font-size:.95rem;color:var(--yazi);background:var(--panel);border:1px solid var(--cizgi);border-radius:10px;padding:7px 10px;cursor:pointer}
.ib.on{background:var(--a1)}
#liste{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:min(88%,640px);padding:10px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.k{align-self:flex-end;background:linear-gradient(135deg,var(--a1),#4f6df0);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--asistan);border-bottom-left-radius:4px}
.a.hata{background:#4a2326}
.foto{display:block;max-width:220px;max-height:220px;border-radius:10px;margin-bottom:6px}
.m code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--kod);padding:1px 5px;border-radius:5px}
.kod{position:relative;margin:8px 0;white-space:normal}
.kod pre{background:var(--kod);border-radius:10px;padding:14px 12px 12px;overflow-x:auto;white-space:pre}
.kod pre code{background:none;padding:0}
.kopya{position:absolute;top:6px;right:6px;font:inherit;font-size:.72rem;color:var(--soluk);background:var(--panel);border:1px solid var(--cizgi);border-radius:6px;padding:2px 8px;cursor:pointer}
#onizle{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--cizgi);background:var(--panel)}
#onizle[hidden]{display:none}
#onizle img{height:56px;border-radius:8px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--cizgi);background:var(--panel);align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;color:var(--yazi);background:var(--bg);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;max-height:140px}
textarea:focus,.ib:focus-visible,select:focus-visible{outline:2px solid var(--a1)}
#b{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
#b.dur{background:#b8434a}
#mik.on{background:#c0392b;animation:nb 1s infinite}
@keyframes nb{50%{opacity:.6}}
@media (max-width:760px){
  #yan{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}
  #yan.ac{transform:none}
  #menu{display:block}
}
@media (prefers-reduced-motion:reduce){#yan{transition:none}#mik.on{animation:none}#liste{scroll-behavior:auto}}
#araclar{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid var(--cizgi);flex-wrap:wrap}
#araclar .ib{font-size:.82rem;padding:5px 10px;border-radius:999px}
dialog{margin:auto;width:min(460px,92vw);background:var(--panel);color:var(--yazi);border:1px solid var(--cizgi);border-radius:16px;padding:18px}
dialog::backdrop{background:#000a}
dialog h2{font-size:1.1rem;margin-bottom:6px}
dialog p{color:var(--soluk);font-size:.85rem;margin-bottom:10px}
dialog textarea{width:100%;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--hover);border:1px solid var(--a2);padding:8px 14px;border-radius:999px;font-size:.88rem;z-index:20;max-width:90vw}
.katex-display{overflow-x:auto;overflow-y:hidden}
:root[data-tema="acik"]{--bg:#f3f6fc;--panel:#ffffff;--cizgi:#d8e0ef;--yazi:#16202e;--soluk:#5b6b85;--asistan:#e7ecf7;--kod:#edf0f8;--hover:#e1e8f6;color-scheme:light}
:root[data-tema="acik"] .a.hata{background:#ffd9dc}
.hizli{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:min(88%,640px)}
.hz{font:inherit;font-size:.88rem;color:var(--yazi);background:var(--panel);border:1px solid var(--cizgi);border-radius:999px;padding:7px 12px;cursor:pointer}
.hz:hover{border-color:var(--a2)}
.eylem{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.eylem button{font:inherit;font-size:.78rem;color:var(--soluk);background:none;border:1px solid var(--cizgi);border-radius:999px;padding:3px 10px;cursor:pointer}
.eylem button:hover{color:var(--yazi)}
.sat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sat label{font-size:.85rem;color:var(--soluk);display:flex;flex-direction:column;gap:4px}
dialog h3{font-size:.95rem;margin-bottom:4px}
dialog input{width:100%;font:inherit;color:var(--yazi);background:var(--bg);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;margin-bottom:10px}
#girishata{color:#ff7b86;font-size:.85rem;min-height:1.2em;margin-bottom:6px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<aside id="yan">
  <div class="marka"><span class="lg" id="logo"></span><span id="ad"></span></div>
  <button class="yenib" id="yeni" type="button">+ Yeni sohbet</button>
  <div id="liste2"></div>
</aside>
<div id="ana">
  <header>
    <button class="ib" id="menu" type="button" aria-label="Sohbetler">☰</button>
    <h1 id="baslik"></h1>
    <select id="mod" aria-label="Mod">
      <option value="genel">Genel</option>
      <option value="kodlama">Kodlama</option>
      <option value="cevirmen">Çevirmen</option>
      <option value="ozetleyici">Özetleyici</option>
      <option value="ders">Ders / Ödev</option>
    </select>
    <button class="ib" id="ayarb" type="button" aria-label="Ayarlar" title="Ayarlar">⚙</button>
  </header>
  <div id="araclar">
    <button class="ib" id="ses" type="button" title="Cevapları sesli oku">🔈 Sesli oku</button>
  </div>
  <div id="liste" aria-live="polite"></div>
  <div id="onizle" hidden><img id="onimg" alt="Seçilen resim"><button class="ib" id="onkaldir" type="button">Kaldır</button></div>
  <form id="f">
    <input type="file" id="dosya" accept="image/*" hidden>
    <button class="ib" id="ek" type="button" aria-label="Resim ekle">📎</button>
    <button class="ib" id="mik" type="button" aria-label="Mikrofon">🎤</button>
    <textarea id="t" rows="1" placeholder="Mesajını yaz..."></textarea>
    <button id="b">Gönder</button>
  </form>
</div>
<dialog id="giris">
  <h2>Şifre</h2>
  <p>Bu uygulamaya girmek için şifre gerekli.</p>
  <input type="password" id="sifre" placeholder="Şifre" autocomplete="current-password">
  <div id="girishata"></div>
  <button class="ib" id="girisb" type="button">Giriş</button>
</dialog>
<dialog id="ayar">
  <h2>Ayarlar</h2>
  <div class="sat">
    <label>Tema <select id="tema"><option value="koyu">Koyu</option><option value="acik">Açık</option><option value="oto">Cihaza göre</option></select></label>
    <label>Yazı boyutu <select id="boyut"><option value="kucuk">Küçük</option><option value="normal">Normal</option><option value="buyuk">Büyük</option></select></label>
  </div>
  <h3>Benim hakkımda</h3>
  <p>Asistan bunları hatırlar ve yeni öğrendiklerini buraya kendisi ekler. Her satır bir bilgi. Bu yazılar tarayıcında saklanır ve her mesajla yapay zekaya gönderilir; şifre ya da gizli bilgi yazma.</p>
  <textarea id="profil" rows="8" placeholder="Adım Ali&#10;8. sınıfa gidiyorum&#10;Futbolu severim"></textarea>
  <button class="ib" id="ayarkapat" type="button">Kaydet ve kapat</button>
</dialog>
<script>
// ---- Kendine göre değiştir ----
const AD = "AbdulGPT";   // Uygulama adın
const LOGO = "🤖";       // Emoji ya da bir resim dosyası adı (örn. "logo.png", public klasörüne koy)
// -------------------------------
const $ = id => document.getElementById(id);
const KEY = "abdulgpt_v2";
let gor = { tema: "koyu", boyut: "normal" };
try { gor = Object.assign(gor, JSON.parse(localStorage.getItem("abdulgpt_gorunum"))); } catch {}
function gorunum(){
  const acik = gor.tema === "acik" || (gor.tema === "oto" && matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.dataset.tema = acik ? "acik" : "koyu";
  document.documentElement.style.fontSize = { kucuk: "14px", normal: "16px", buyuk: "19px" }[gor.boyut] || "16px";
}
gorunum();
const liste = $("liste"), t = $("t"), b = $("b"), modSec = $("mod");
let db = null, ac = null, yaziyor = false, bekleyen = null, sesli = false;

document.title = AD; $("ad").textContent = AD;
if (/\.(png|jpe?g|svg|webp)$/i.test(LOGO)) { const i = document.createElement("img"); i.src = LOGO; i.alt = ""; $("logo").appendChild(i); }
else $("logo").textContent = LOGO;

try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!db || !Array.isArray(db.sohbetler) || !db.sohbetler.length) { db = { aktif: null, sohbetler: [] }; yeniSohbet(false); }
const cur = () => db.sohbetler.find(s => s.id === db.aktif) || db.sohbetler[0];
function kaydet(){ try { localStorage.setItem(KEY, JSON.stringify(db, (k, v) => k === "img" ? undefined : v)); } catch {} }
function yeniSohbet(ciz = true){
  const s = { id: Date.now().toString(36), baslik: "Yeni sohbet", mod: "genel", m: [] };
  db.sohbetler.unshift(s); db.aktif = s.id;
  if (db.sohbetler.length > 30) db.sohbetler.pop();
  kaydet(); if (ciz) cizHepsi();
}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  return s.split("```").map((p, i) => {
    if (i % 2) { const nl = p.indexOf("\n"), kod = nl >= 0 ? p.slice(nl + 1) : "";
      return '<div class="kod"><button type="button" class="kopya">Kopyala</button><pre><code>' + esc(kod.replace(/\n$/, "")) + '</code></pre></div>'; }
    return esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  }).join("");
}
const kaydir = () => { liste.scrollTop = liste.scrollHeight; };
function ekle(metin, sinif, img, foto){
  const d = document.createElement("div"); d.className = "m " + sinif;
  if (sinif === "a") { d.innerHTML = md(temizle(metin)); mat(d); }
  else {
    if (img) { const i = document.createElement("img"); i.src = img; i.className = "foto"; i.alt = "Gönderilen resim"; d.appendChild(i); }
    else if (foto) { const p = document.createElement("div"); p.textContent = "📷 (resim)"; d.appendChild(p); }
    if (metin) d.appendChild(document.createTextNode(metin));
  }
  liste.appendChild(d); kaydir(); return d;
}
const HIZLI = {
  genel: ["Bana ilginç bir bilgi ver", "Bugün için bir plan yap", "Kısa bir hikaye yaz", "Şunu basitçe açıkla:"],
  kodlama: ["Basit bir HTML sayfası yaz", "Bu kodu açıkla:", "Şu hatayı çöz:"],
  cevirmen: ["İngilizceye çevir:", "Türkçeye çevir:"],
  ozetleyici: ["Şu metni özetle:", "Ana fikirleri çıkar:"],
  ders: ["Bir matematik sorusu çöz:", "Konuyu basitçe anlat:", "Bana 5 test sorusu hazırla"]
};
function hizliCiz(mod){
  const h = document.createElement("div"); h.className = "hizli";
  h.innerHTML = (HIZLI[mod] || HIZLI.genel).map(x => `<button type="button" class="hz" data-q="${esc(x)}">${esc(x)}</button>`).join("");
  liste.appendChild(h);
}
function eylemSil(){ liste.querySelectorAll(".eylem").forEach(e => e.remove()); }
function eylemEkle(){
  eylemSil();
  const s = cur(), son = s.m[s.m.length - 1], bub = liste.lastElementChild;
  if (!son || son.role !== "assistant" || !bub || !bub.classList.contains("a") || bub.classList.contains("hata")) return;
  const d = document.createElement("div"); d.className = "eylem";
  d.innerHTML = '<button type="button" data-e="kopya">📋 Kopyala</button><button type="button" data-e="yeniden">🔄 Yeniden üret</button>';
  bub.appendChild(d);
}
function cizYan(){
  $("liste2").innerHTML = db.sohbetler.map(s =>
    `<div class="it ${s.id === db.aktif ? "on" : ""}" data-id="${s.id}"><span>${esc(s.baslik)}</span><button type="button" class="sil" data-sil="${s.id}" aria-label="Sohbeti sil">✕</button></div>`).join("");
}
function cizHepsi(){
  const s = cur(); $("baslik").textContent = s.baslik; modSec.value = s.mod;
  liste.innerHTML = "";
  if (!s.m.length) { ekle("Merhaba! Ben " + AD + ". Bana yazabilir, 📎 ile resim ekleyebilir, 🎤 ile konuşabilirsin.", "a"); hizliCiz(s.mod); }
  s.m.forEach(m => ekle(m.content, m.role === "user" ? "k" : "a", null, m.foto));
  eylemEkle(); cizYan(); $("yan").classList.remove("ac");
}
cizHepsi();

$("liste2").addEventListener("click", e => {
  const sil = e.target.dataset.sil;
  if (sil) {
    if (yaziyor) ac.abort();
    db.sohbetler = db.sohbetler.filter(s => s.id !== sil);
    if (!db.sohbetler.length) yeniSohbet(false);
    if (db.aktif === sil) db.aktif = db.sohbetler[0].id;
    kaydet(); cizHepsi(); return;
  }
  const it = e.target.closest(".it");
  if (it && !yaziyor) { db.aktif = it.dataset.id; kaydet(); cizHepsi(); }
});
$("yeni").addEventListener("click", () => { if (yaziyor) ac.abort(); yeniSohbet(); });
$("menu").addEventListener("click", () => $("yan").classList.toggle("ac"));
modSec.addEventListener("change", () => { cur().mod = modSec.value; kaydet(); if (!cur().m.length) cizHepsi(); });
liste.addEventListener("click", e => {
  if (!e.target.classList.contains("kopya")) return;
  navigator.clipboard.writeText(e.target.parentElement.querySelector("code").textContent)
    .then(() => { e.target.textContent = "Kopyalandı"; setTimeout(() => e.target.textContent = "Kopyala", 1500); });
});

// Resim ekleme (küçültüp JPEG yapar)
$("ek").addEventListener("click", () => $("dosya").click());
$("dosya").addEventListener("change", () => {
  const f = $("dosya").files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement("canvas");
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
    bekleyen = c.toDataURL("image/jpeg", 0.8); $("onimg").src = bekleyen; $("onizle").hidden = false;
  }; im.src = rd.result; };
  rd.readAsDataURL(f);
});
$("onkaldir").addEventListener("click", () => { bekleyen = null; $("onizle").hidden = true; $("dosya").value = ""; });

// Mikrofon (konuşmayı yazıya çevirir)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) $("mik").hidden = true;
else {
  rec = new SR(); rec.lang = "tr-TR"; rec.interimResults = true;
  rec.onresult = e => { t.value = Array.from(e.results).map(r => r[0].transcript).join(""); t.dispatchEvent(new Event("input")); };
  rec.onend = () => $("mik").classList.remove("on");
  rec.onerror = () => $("mik").classList.remove("on");
  $("mik").addEventListener("click", () => {
    if ($("mik").classList.contains("on")) { rec.stop(); return; }
    try { rec.start(); $("mik").classList.add("on"); } catch {}
  });
}
// Cevapları sesli okuma
if (!window.speechSynthesis) $("ses").hidden = true;
$("ses").addEventListener("click", () => {
  sesli = !sesli; $("ses").classList.toggle("on", sesli);
  if (!sesli) speechSynthesis.cancel();
});
function oku(metin){
  const u = new SpeechSynthesisUtterance(metin.replace(/```[\s\S]*?```/g, " kod bloğu ").replace(/[*`#]/g, ""));
  u.lang = "tr-TR"; speechSynthesis.speak(u);
}

function temizle(s){ return s.replace(/\[HATIRLA:[^\]]*\]/g, "").replace(/\[HATIRLA:[^\]]*$/, "").replace(/\s+$/, ""); }
function mat(el){
  if (window.renderMathInElement && cur().mod === "ders")
    try { renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false }); } catch {}
}
const profilGet = () => { try { return localStorage.getItem("abdulgpt_profil") || ""; } catch { return ""; } };
const profilSet = v => { try { localStorage.setItem("abdulgpt_profil", v); } catch {} };
function bildir(m){ const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }
function profilEkle(bilgiler){
  const satir = profilGet().split("\n").map(x => x.trim()).filter(Boolean), yeni = [];
  bilgiler.forEach(x => { x = x.slice(0, 120); if (!satir.some(y => y.toLowerCase() === x.toLowerCase())) { satir.push(x); yeni.push(x); } });
  if (!yeni.length) return;
  profilSet(satir.slice(-25).join("\n")); bildir("Hatırladım: " + yeni.join(", "));
}
$("ayarb").addEventListener("click", () => { $("profil").value = profilGet(); $("tema").value = gor.tema; $("boyut").value = gor.boyut; $("ayar").showModal(); });
$("ayarkapat").addEventListener("click", () => { profilSet($("profil").value.trim()); $("ayar").close(); });
addEventListener("load", () => { if (cur().mod === "ders") cizHepsi(); });
function arayuz(acik){ yaziyor = acik; b.textContent = acik ? "Durdur" : "Gönder"; b.classList.toggle("dur", acik); }

async function gonder(yeniden = false){
  const s = cur();
  if (!yeniden) {
    const metin = t.value.trim();
    if (!metin && !bekleyen) return;
    if (!s.m.length) liste.innerHTML = "";
    const img = bekleyen; bekleyen = null; $("onizle").hidden = true; $("dosya").value = "";
    t.value = ""; t.style.height = "auto";
    s.m.push({ role: "user", content: metin, img: img || undefined, foto: img ? true : undefined });
    if (s.baslik === "Yeni sohbet") { s.baslik = (metin || "Resim").slice(0, 32); $("baslik").textContent = s.baslik; }
    ekle(metin, "k", img); cizYan();
  }
  eylemSil();
  if (window.speechSynthesis) speechSynthesis.cancel();
  const bub = ekle("…", "a");
  ac = new AbortController(); arayuz(true);
  let cevap = "";
  try {
    const govde = s.m.map((x, i) => ({
      role: x.role,
      content: x.content || (x.img ? "Bu resmi anlat." : x.foto ? "(resim gönderildi)" : ""),
      image: i === s.m.length - 1 ? x.img : undefined
    }));
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "x-sifre": encodeURIComponent(sifre) }, signal: ac.signal,
      body: JSON.stringify({ messages: govde, mod: s.mod, profil: profilGet().slice(0, 1200) }) });
    if (r.status === 401) { sifre = ""; try { localStorage.removeItem("abdulgpt_sifre"); } catch {} girisAc("Şifre gerekli."); }
    if (!r.ok) { const v = await r.json().catch(() => ({})); throw new Error(v.hata || "Bir hata oluştu"); }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
